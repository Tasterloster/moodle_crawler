<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>Moodle Crawler</title>
</head>
<body>
  <header>
    <img src="../icons/icon.svg" alt="" width="24" height="24">
    <h1>Moodle Crawler</h1>
  </header>

  <div id="status" class="status status--wait" data-i18n="ui.checking">Kursseite wird geprüft …</div>

  <section id="course" class="course" hidden>
    <strong id="course-name"></strong>
    <span id="course-meta" class="muted"></span>
  </section>

  <section id="scope" class="scope" hidden>
    <label><input type="radio" name="scope" value="current" checked> <span data-i18n="ui.scopeCurrent">Nur dieser Kurs</span></label>
    <label><input type="radio" name="scope" value="all"> <span data-i18n="ui.scopeAll">Alle meine Kurse</span></label>
  </section>

  <section id="courselist" class="courselist" hidden>
    <div class="courselist-head">
      <span id="courselist-count" class="muted"></span>
      <button type="button" id="toggle-all" class="link" data-i18n="ui.toggleAll">alle ab-/auswählen</button>
    </div>
    <div id="courselist-items"></div>
  </section>

  <section id="options" class="options" hidden>
    <label><input type="checkbox" id="opt-files" checked> <span data-i18n="ui.optFiles">Dateien herunterladen</span> <span class="muted" data-i18n="ui.optFilesHint">(PDFs, Ordner, Anhänge)</span></label>
    <label><input type="checkbox" id="opt-texts" checked> <span data-i18n="ui.optTexts">Texte &amp; Seiten speichern</span></label>
    <label><input type="checkbox" id="opt-images" checked> <span data-i18n="ui.optImages">Bilder aus Texten mitladen</span></label>
    <label><input type="checkbox" id="opt-submissions" checked> <span data-i18n="ui.optSubmissions">Eigene Abgaben &amp; Feedback</span> <span class="muted" data-i18n="ui.optSubmissionsHint">(deine Uploads, Bewertungen)</span></label>
    <label><input type="checkbox" id="opt-forums"> <span data-i18n="ui.optForums">Forenbeiträge einbeziehen</span> <span class="muted" data-i18n="ui.optForumsHint">(langsam)</span></label>
    <label><input type="checkbox" id="opt-allsections" checked> <span data-i18n="ui.optAllSections">Alle Abschnittsseiten durchsuchen</span></label>

    <div class="row">
      <label class="inline" for="opt-format" data-i18n="ui.optFormat">Format</label>
      <select id="opt-format">
        <option value="md" data-i18n="ui.optFormatMd">Markdown (Obsidian)</option>
        <option value="html" data-i18n="ui.optFormatHtml">HTML</option>
        <option value="both" data-i18n="ui.optFormatBoth">Markdown + HTML</option>
      </select>
    </div>
    <div class="row" id="row-combine" hidden>
      <label class="inline" for="opt-combine" data-i18n="ui.optCombine">Mehrere Kurse</label>
      <select id="opt-combine">
        <option value="separate" data-i18n="ui.optCombineSeparate">Ein Archiv pro Kurs</option>
        <option value="single" data-i18n="ui.optCombineSingle">Alles in einem Archiv</option>
      </select>
    </div>
    <div class="row">
      <label class="inline" for="opt-language" data-i18n="ui.optLanguage">Sprache</label>
      <select id="opt-language">
        <option value="auto" data-i18n="ui.langAuto">Automatisch</option>
        <option value="de" data-i18n="ui.langDe">Deutsch</option>
        <option value="en" data-i18n="ui.langEn">English</option>
      </select>
    </div>
    <div class="row">
      <label class="inline" for="opt-maxsize" data-i18n="ui.optMaxSize">Max. Dateigröße</label>
      <input type="number" id="opt-maxsize" min="0" step="10" value="0">
      <span class="muted" data-i18n="ui.optMaxSizeHint">MB (0 = unbegrenzt)</span>
    </div>
    <div class="row">
      <label class="inline" for="opt-delay" data-i18n="ui.optDelay">Pause je Anfrage</label>
      <input type="number" id="opt-delay" min="0" step="50" value="150">
      <span class="muted" data-i18n="ui.optDelayHint">ms</span>
    </div>
  </section>

  <div class="actions">
    <button id="start" disabled data-i18n="ui.download">Kurs herunterladen</button>
    <button id="cancel" class="secondary" hidden data-i18n="ui.cancel">Abbrechen</button>
  </div>

  <section id="progress" class="progress" hidden>
    <div id="mode-hint" class="muted"></div>
    <div id="course-progress" class="muted"></div>
    <div class="bar"><div id="bar-fill"></div></div>
    <div id="progress-text" class="muted"></div>
    <div id="stats" class="muted"></div>
  </section>

  <details id="log-box" hidden>
    <summary data-i18n="ui.log">Protokoll</summary>
    <div id="log" class="log"></div>
  </details>

  <script src="../lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
